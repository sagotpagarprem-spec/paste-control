name: CI - Universal Pest Control

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Lint & Test Suite
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: universal_pest_control
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Syntax & Lint Checks
        run: |
          find server js -name "*.js" -exec node --check {} +
          node --check server.js

      - name: Run Database Migrations
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: universal_pest_control
          JWT_SECRET: a_very_secure_high_entropy_production_jwt_secret_key_2026!
        run: npm run db:migrate

      - name: Run Security Sprint Test Suite
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: universal_pest_control
          JWT_SECRET: a_very_secure_high_entropy_production_jwt_secret_key_2026!
        run: npm run test:security

      - name: Run Phase 1 Verification (Auth & RBAC)
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: universal_pest_control
          JWT_SECRET: a_very_secure_high_entropy_production_jwt_secret_key_2026!
        run: npm run test:phase1

      - name: Run Phase 2 Verification (Leads & CRM)
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: universal_pest_control
          JWT_SECRET: a_very_secure_high_entropy_production_jwt_secret_key_2026!
        run: npm run test:phase2

      - name: Run Phase 3 Verification (Bookings & Customers)
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: universal_pest_control
          JWT_SECRET: a_very_secure_high_entropy_production_jwt_secret_key_2026!
        run: npm run test:phase3

      - name: Run Phase 4 Verification (CMS & Catalogs)
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: universal_pest_control
          JWT_SECRET: a_very_secure_high_entropy_production_jwt_secret_key_2026!
        run: npm run test:phase4

      - name: Run Phase 5 Verification (Technician & Dispatch)
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: universal_pest_control
          JWT_SECRET: a_very_secure_high_entropy_production_jwt_secret_key_2026!
        run: npm run test:phase5

      - name: Run Master End-to-End Suite
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: universal_pest_control
          JWT_SECRET: a_very_secure_high_entropy_production_jwt_secret_key_2026!
        run: npm test
