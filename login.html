<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Universal Pest Control Enterprise</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#064E3B">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0F172A 0%, #064E3B 50%, #0F172A 100%);
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 10;
    }

    .login-card {
      background: #FFFFFF;
      border-radius: var(--radius-xl, 16px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }

    .login-header {
      background: #0F172A;
      padding: 2.25rem 2rem 1.75rem;
      text-align: center;
      position: relative;
      border-bottom: 2px solid #059669;
    }

    .login-brand-icon {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: linear-gradient(135deg, #059669, #064E3B);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: 0 8px 16px rgba(5, 150, 105, 0.3);
    }

    .login-title {
      color: #FFFFFF;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .login-title span {
      color: #34D399;
    }

    .login-subtitle {
      color: #94A3B8;
      font-size: 0.8rem;
      margin: 0;
    }

    .login-body {
      padding: 2rem;
    }

    .login-alert {
      display: none;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      line-height: 1.4;
    }

    .login-alert.danger {
      background: #FEF2F2;
      color: #991B1B;
      border: 1px solid #FCA5A5;
      display: block;
    }

    .login-alert.success {
      background: #ECFDF5;
      color: #065F46;
      border: 1px solid #6EE7B7;
      display: block;
    }

    .demo-credentials-card {
      background: #F8FAFC;
      border: 1px dashed #CBD5E1;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: #475569;
    }

    .demo-credentials-card strong {
      color: #0F172A;
    }

    .fill-demo-btn {
      background: #ECFDF5;
      border: 1px solid #A7F3D0;
      border-radius: 6px;
      color: #065F46;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      padding: 0.35rem 0.75rem;
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 0;
      text-decoration: none;
      transition: all 0.2s;
    }

    .fill-demo-btn:hover {
      background: #D1FAE5;
      border-color: #6EE7B7;
    }

    @media (max-width: 480px) {
      body {
        padding: 0.75rem;
      }
      .login-header {
        padding: 1.5rem 1rem 1.25rem;
      }
      .login-body {
        padding: 1.25rem 1rem;
      }
      .login-title {
        font-size: 1.2rem;
      }
      .demo-credentials-card {
        padding: 0.75rem 0.65rem;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      
      <!-- Card Header -->
      <div class="login-header">
        <img src="assets/images/logo.png" alt="Universal Pest Control official logo" style="max-height:85px; width:auto; max-width:220px; margin:0 auto 1rem; display:block; filter:drop-shadow(0 6px 16px rgba(0,0,0,0.45));">
        <div class="login-title">UPC <span>ENTERPRISE</span></div>
        <p class="login-subtitle">Admin CRM & Operations Command Portal</p>
      </div>

      <!-- Card Body -->
      <div class="login-body">
        
        <!-- Feedback Alert -->
        <div id="loginAlert" class="login-alert"></div>

        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
          
          <div class="form-group" style="margin-bottom:1.25rem;">
            <label class="form-label" for="loginEmail" style="font-weight:700; color:#334155;">Work Email Address</label>
            <input 
              type="email" 
              id="loginEmail" 
              class="form-control" 
              placeholder="admin@universalpestcontrol.com" 
              required 
              autocomplete="email"
              style="padding:0.75rem 1rem;"
            >
          </div>

          <div class="form-group" style="margin-bottom:1.25rem;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.35rem;">
              <label class="form-label" for="loginPassword" style="margin-bottom:0; font-weight:700; color:#334155;">Password</label>
              <span style="font-size:0.75rem; color:#64748B;">Protected by JWT & Bcrypt</span>
            </div>
            <input 
              type="password" 
              id="loginPassword" 
              class="form-control" 
              placeholder="••••••••••••" 
              required 
              autocomplete="current-password"
              style="padding:0.75rem 1rem;"
            >
          </div>

          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; font-size:0.825rem; flex-wrap:wrap; gap:0.5rem;">
            <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer; color:#475569; min-height:36px;">
              <input type="checkbox" id="rememberMe" checked style="width:16px; height:16px; accent-color:#059669;">
              <span>Keep session active</span>
            </label>
            <a href="index.html" style="color:#059669; text-decoration:none; font-weight:600; padding:0.25rem 0;">Back to Site</a>
          </div>

          <button 
            type="submit" 
            id="btnLoginSubmit" 
            class="btn btn-primary" 
            style="width:100%; padding:0.85rem; font-size:0.95rem; justify-content:center;"
          >
            <span id="btnText">Sign In to Admin Portal</span>
          </button>
        </form>

        <!-- Administrator Setup Note -->
        <div class="demo-credentials-card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>Admin Login:</strong>
            <button type="button" class="fill-demo-btn" onclick="fillDemoCredentials()">Fill Email</button>
          </div>
          <div style="margin-top:0.25rem;">Email: <code>admin@universalpestcontrol.com</code></div>
          <div style="margin-top:0.35rem; font-size:0.75rem; color:#64748B;">Initial setup: Configure administrator password via <code>npm run admin:create</code></div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/api-client.js"></script>
  <script>
    // If already logged in, redirect straight to admin.html
    document.addEventListener('DOMContentLoaded', () => {
      if (window.upcApi && window.upcApi.auth.isAuthenticated()) {
        window.location.replace('admin.html');
      }
    });

    function fillDemoCredentials() {
      document.getElementById('loginEmail').value = 'admin@universalpestcontrol.com';
      document.getElementById('loginPassword').focus();
    }

    async function handleAdminLogin(event) {
      event.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const alertBox = document.getElementById('loginAlert');
      const submitBtn = document.getElementById('btnLoginSubmit');
      const btnText = document.getElementById('btnText');

      alertBox.className = 'login-alert';
      alertBox.style.display = 'none';

      submitBtn.disabled = true;
      btnText.textContent = 'Verifying credentials...';

      try {
        const response = await window.upcApi.auth.login(email, password);
        alertBox.className = 'login-alert success';
        alertBox.textContent = 'Authentication successful! Redirecting to dashboard...';
        alertBox.style.display = 'block';

        setTimeout(() => {
          window.location.href = 'admin.html';
        }, 600);
      } catch (err) {
        submitBtn.disabled = false;
        btnText.textContent = 'Sign In to Admin Portal';

        alertBox.className = 'login-alert danger';
        alertBox.textContent = err.message || 'Login failed. Please check your credentials or database status.';
        alertBox.style.display = 'block';
      }
    }
  </script>
</body>
</html>
