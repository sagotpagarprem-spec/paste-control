<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 — Server Encountered an Issue | Universal Pest Control</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0F172A;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      box-sizing: border-box;
      text-align: center;
    }
    .error-card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      padding: 3rem 2rem;
      border-radius: 16px;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .badge-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      color: #EF4444;
      line-height: 1;
      letter-spacing: -0.04em;
      margin-bottom: 0.5rem;
    }
    .error-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 1rem;
    }
    .error-desc {
      color: #94A3B8;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .actions-row {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-primary {
      background: #059669;
      color: #FFFFFF;
      padding: 0.8rem 1.75rem;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary:hover {
      background: #047857;
      transform: translateY(-2px);
    }
    .btn-emergency {
      background: #25D366;
      color: #FFFFFF;
      padding: 0.8rem 1.75rem;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-emergency:hover {
      background: #1EBE5D;
      transform: translateY(-2px);
    }
    .contact-hint {
      margin-top: 1.75rem;
      font-size: 0.875rem;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="badge-icon">⚡</div>
    <div class="error-code">500</div>
    <h1 class="error-title">Service Interruption Detected</h1>
    <p class="error-desc">
      Our server encountered a temporary hiccup while processing your request. Our automated monitoring team has been notified and is fixing it.
    </p>
    <div class="actions-row">
      <a href="/" class="btn-primary">
        <span>🔄 Return to Safety</span>
      </a>
      <a href="https://wa.me/919823001122?text=Emergency%20Service%20Request" target="_blank" class="btn-emergency">
        <span>💬 Instant WhatsApp Support</span>
      </a>
    </div>
    <div class="contact-hint">
      24/7 Pune Operations Dispatch: <strong>+91 98230 01122</strong>
    </div>
  </div>
</body>
</html>
