<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found (404) — Universal Pest Control</title>
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
    }
    .error-container {
      margin: auto;
      text-align: center;
      padding: 3rem 1.5rem;
      max-width: 580px;
    }
    .error-code {
      font-size: 6rem;
      font-weight: 800;
      color: #059669;
      line-height: 1;
      margin-bottom: 0.5rem;
      letter-spacing: -0.04em;
    }
    .error-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 1rem;
    }
    .error-desc {
      color: #64748B;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .actions-row {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .btn-home {
      background: #059669;
      color: #FFFFFF;
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-home:hover {
      background: #047857;
    }
    .btn-wa {
      background: #25D366;
      color: #FFFFFF;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    @media (max-width: 480px) {
      .actions-row {
        flex-direction: column;
        width: 100%;
      }
      .btn-home, .btn-wa {
        width: 100%;
        box-sizing: border-box;
        text-align: center;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div style="font-size:3rem; margin-bottom:1rem;">🛡️</div>
    <div class="error-code">404</div>
    <h1 class="error-title">Pest Free, But Page Not Found</h1>
    <p class="error-desc">
      The page you're searching for might have been moved, renamed, or temporarily unavailable. Our inspection team is already looking into it!
    </p>
    <div class="actions-row">
      <a href="index.html" class="btn-home">← Back to Homepage</a>
      <a href="https://wa.me/919822012345?text=Hi%20Universal%20Pest%20Control%2C%20I%20need%20assistance" target="_blank" class="btn-wa">
        💬 Chat on WhatsApp
      </a>
    </div>
  </div>
</body>
</html>
